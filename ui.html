<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141413">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mando</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root{--bg:#141413;--panel:#1f1e1d;--line:#2e2d2b;--text:#ecebe6;--muted:#9b9a94;--accent:#d97757;
        --ok:#3fa66b;--bad:#d9534f;--user:#2b3a55;--r:14px}
  @media (prefers-color-scheme:light){:root{--bg:#f6f5f1;--panel:#fff;--line:#e3e1da;--text:#1f1e1d;--muted:#6b6a65;--user:#dbe6f7}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none;cursor:pointer;
       outline:8px solid transparent}  /* área de toque más grande */
  #dot.idle{background:var(--ok)} #dot.busy{background:var(--accent);animation:pulse 1s infinite} #dot.off{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}
  /* todo lo que se toca muestra la mano; lo deshabilitado, que no se puede */
  button,[role=button],summary,select,label:has(input[type=checkbox]),label:has(input[type=radio]),input[type=checkbox],input[type=radio],input[type=file]{cursor:pointer}
  button:disabled,button[aria-disabled=true],.full{cursor:not-allowed}
  .icon{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font-size:14px}
  /* se despliega sobre el contenido, bajo la cabecera (en el celular a todo el ancho) */
  #menu{display:none;position:absolute;left:0;right:0;top:100%;z-index:5;max-height:calc(100vh - 70px);overflow:auto;
        padding:6px 12px 10px;border-bottom:1px solid var(--line);background:var(--panel);box-shadow:0 10px 24px rgba(0,0,0,.25)}
  #menu.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
  #menu section{display:flex;flex-direction:column;gap:2px;min-width:0}
  #menu h4{margin:8px 0 2px;padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;border:0;border-radius:8px;
               background:none;color:var(--text);font:inherit;font-size:14px;text-align:left}
  #menu button:hover,#menu button:focus-visible{background:color-mix(in srgb,var(--text) 8%,transparent)}
  #menu .mi{width:22px;flex:none;text-align:center}
  #menu .menu-foot{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  #menu .menu-foot button{color:var(--bad)}
  @media (min-width:760px){
    /* escritorio: panel que se despliega bajo el botón, no una franja de botones sueltos */
    #menu.open{left:auto;right:12px;top:calc(100% + 6px);width:600px;max-height:calc(100vh - 80px);
               grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;
               box-shadow:0 12px 32px rgba(0,0,0,.28);padding:8px 10px 10px;z-index:5}
    #menu button{min-height:34px}
  }
  #findBar{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--card,#f6f6f6)}
  #findBar[hidden]{display:none}
  #findInput{flex:1;min-width:0;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  #findCount{font-size:12px;opacity:.75;min-width:3.5em;text-align:center;font-variant-numeric:tabular-nums}
  #findBar button{min-width:36px;min-height:36px}
  mark.hit{background:#ffe066;color:#000;border-radius:2px}
  mark.hit.cur{background:#ff9f1a;outline:2px solid #ff9f1a}
  #findAll[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
  #findAll[hidden]{display:none}
  #tabs .tfind{flex:none;font-size:11px;padding:0 5px;border-radius:8px;background:#ffe066;color:#000}
  #cwdbar{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 12px;border-bottom:1px solid var(--line)}
  #cwd{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #modeBtn{flex:none;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
  #modeBtn.acceptEdits{border-color:var(--accent);color:var(--accent)}
  #modeBtn.plan{border-color:#5b8def;color:#5b8def}
  #modelBtn{flex:none;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-left:6px}
  #modelBtn.custom{border-color:var(--accent);color:var(--accent)}
  .mode-opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
  .mode-opt small{display:block;color:var(--muted);margin-top:2px}
  .mode-opt.on{outline:2px solid var(--accent)}
  .rules h4{margin:14px 0 6px;font-size:14px}
  .rule{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .rule .what{flex:1;min-width:0}
  .rule .what code{word-break:break-all}
  .rule .what small{display:block;color:var(--muted)}
  .rule button{flex:none;background:none;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 10px}
  .rule-form{display:grid;gap:8px;margin-top:10px}
  .rule-form select,.rule-form input{width:100%;min-width:0;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px}
  .rule-form .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .rule-form button{padding:10px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
  .sess{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .sess .who{flex:1;min-width:0}
  .sess .who small{display:block;color:var(--muted)}
  .sess .me{color:var(--ok);font-size:12px;font-weight:600}
  .sess button,.sec-actions button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 10px;font-size:14px}
  .sec-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .sec-actions button.danger{border-color:var(--bad);color:var(--bad)}
  .newtoken{word-break:break-all;background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:8px;font:13px ui-monospace,Menlo,monospace}
.totp-qr{display:block;width:190px;height:190px;margin:8px auto;background:#fff;border-radius:8px;padding:6px}
.totp-form{display:flex;gap:8px;margin-top:8px}.totp-form button{background:var(--accent,#d97757);border:0;color:#fff;font-weight:600;padding:8px 14px;border-radius:10px}.totp-form input{flex:1;min-width:0;font-size:20px;letter-spacing:4px;text-align:center}
.steps{padding-left:20px;margin:8px 0}
  .audit-row{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
  .audit-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .audit-row code{font-size:12px}
  .plan-body{max-height:22em;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--bg)}
  main{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  main[hidden]{display:none}   /* chats de las otras pestañas */
  .msg{max-width:92%;padding:10px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
  .msg.streaming::after{content:"▍";color:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.msg.streaming::after{animation:none}}
  .user{align-self:flex-end;background:var(--user);border-color:transparent;white-space:pre-wrap}
  .tool,.info,.done{align-self:center;font-size:13px;color:var(--muted);text-align:center;max-width:100%}
  .tool{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .error{border-color:var(--bad);color:var(--bad)}
  pre{background:rgba(127,127,127,.12);padding:8px;border-radius:8px;overflow-x:auto;font-size:13px;margin:6px 0;white-space:pre}
  code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(127,127,127,.15);padding:1px 4px;border-radius:4px}
  pre code{background:none;padding:0}
  .card{border:1px solid var(--accent);background:var(--panel);border-radius:var(--r);padding:12px;max-width:100%}
  .card h3{margin:0 0 6px;font-size:15px}
  .card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .card button{flex:1 1 auto;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;padding:8px 12px}
  .card button.yes{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
  .card button.no{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
  .card button.sel{outline:2px solid var(--accent)}
  .card .opt{display:block;width:100%;text-align:left}
  .card .opt small{display:block;color:var(--muted)}
  .card.closed{border-color:var(--line);opacity:.8}
  /* ---- diff ---- */
  .diff{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0;background:var(--bg)}
  .diff-head{padding:6px 10px;font-size:13px;border-bottom:1px solid var(--line);color:var(--muted)}
  .diff-head .plus{color:var(--ok);font-weight:700}.diff-head .minus{color:var(--bad);font-weight:700}
  .diff-body{overflow-x:auto;font:12px/1.55 ui-monospace,Menlo,monospace}
  .diff-body.folded{max-height:26em;overflow-y:hidden;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
  .dl{display:flex;white-space:pre;min-width:max-content}
  .dl .ln{flex:none;width:2.8em;text-align:right;padding-right:6px;color:var(--muted);opacity:.7;user-select:none}
  .diff.nonum .dl .ln{display:none}
  .dl .code{padding:0 12px 0 4px}
  .dl .sg{display:inline-block;width:1.1em;user-select:none;opacity:.8}
  .dl.add{background:rgba(63,166,107,.17)}.dl.add .sg{color:var(--ok)}
  .dl.del{background:rgba(217,83,79,.17)}.dl.del .sg{color:var(--bad)}
  .dl.hunk{background:rgba(127,127,127,.12);color:var(--muted)}
  .card button.diff-more{display:block;width:100%;min-height:36px;border:0;border-top:1px solid var(--line);border-radius:0;background:none;color:var(--accent);font-size:14px}
  .card .comment{flex:1 1 100%;display:flex;flex-direction:column;gap:8px}
  .card .comment textarea{width:100%;min-height:72px;resize:vertical;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  .card .comment .actions{margin-top:0}
  .card button.link{background:none;border:0;color:var(--accent);min-height:36px;padding:4px 0;text-align:left;flex:none}
  .card .result{margin-top:8px;font-weight:600}
  /* ---- alertas ---- */
  #alertBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(217,119,87,.15);border-bottom:1px solid var(--accent);font-size:14px}
  #alertBar[hidden]{display:none}
  #alertBar span{flex:1}
  #alertBar button{border:0;border-radius:8px;padding:8px 12px;font-size:14px}
  #alertOn{background:var(--accent);color:#fff;font-weight:600}
  #alertLater{background:none;color:var(--muted)}
  .opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .opt-row small{display:block;color:var(--muted)}
  .opt-row input{width:22px;height:22px;accent-color:var(--accent);flex:none}
  .opt-row select{flex:none;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
  .note{font-size:13px;color:var(--muted);margin:8px 0}
  .note.warn{color:var(--accent)}
  .note a{color:var(--accent)}
  /* ---- indicador "trabajando" ---- */
  #working{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);cursor:default}
  #working[hidden]{display:none}
  #wkGlyph{color:var(--accent);font-size:20px;width:22px;text-align:center;line-height:1;flex:none;
           display:inline-block;transition:transform .12s ease-out}
  #working.waiting #wkGlyph{animation:breathe 1.6s ease-in-out infinite}
  #wkBody{flex:1;min-width:0;display:flex;flex-direction:column}
  #wkLine{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
  #wkVerb{font-weight:600;font-size:15px;
          background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 35%,#f6d2c1 50%,var(--accent) 65%,var(--accent) 100%);
          background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
          animation:shimmer 2.2s linear infinite}
  #working.waiting #wkVerb{animation:none;color:var(--accent);background:none}
  #wkMeta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  #wkAct{color:var(--muted);font:12px ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wkAct:empty{display:none}
  #working.waiting{cursor:pointer}
  @keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
  @keyframes breathe{50%{transform:scale(1.25);opacity:.6}}
  @media (prefers-reduced-motion:reduce){#wkVerb{animation:none;color:var(--accent);background:none}#working.waiting #wkGlyph{animation:none}}
  footer{display:flex;gap:8px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;max-height:40vh;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  #send{min-width:56px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:18px}
  #send:disabled{opacity:.4}
  #stopBtn{min-width:48px;border:1px solid var(--bad);border-radius:12px;background:color-mix(in srgb,var(--bad) 12%,var(--bg));color:var(--bad);font-size:18px;font-weight:700}
  #stopBtn[hidden]{display:none}
  #attachBtn{min-width:40px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:18px;padding:0}
  #attachBar{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 2px;background:var(--panel);border-top:1px solid var(--line)}
  #attachBar[hidden]{display:none}
  #attachBar .att{position:relative;flex:none}
  #attachBar .att img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
  #attachBar .att button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;line-height:22px;padding:0}
  #attachBar .count{align-self:center;color:var(--muted);font-size:12px;white-space:nowrap}
  #attachBar .att.file{display:flex;align-items:center;gap:6px;height:56px;max-width:220px;padding:0 26px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12px}
  #attachBar .att.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #attachBar .att.file small{color:var(--muted);white-space:nowrap}
  .msg .files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .msg .files span{display:inline-flex;gap:4px;align-items:center;padding:3px 8px;border-radius:8px;border:1px solid var(--line);font-size:12px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
  .msg.user.queued{opacity:.75;border:1px dashed rgba(255,255,255,.6)}
  .msg.user.queued.dropped{opacity:.45;text-decoration:line-through}
  .msg.user .qbar{margin-top:6px;font-size:12px;display:flex;align-items:center;gap:8px;text-decoration:none}
  .msg.user .qx{border:0;background:rgba(0,0,0,.2);color:inherit;border-radius:50%;width:22px;height:22px;padding:0;margin-left:auto}
  .msg .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .msg .thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.35)}
  .msg .thumbs .nothumb{font-size:28px}
  #updateBar{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:13px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-bottom:1px solid var(--line)}
  #updateBar[hidden]{display:none}
  .sched{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .sched .sch-main{flex:1;min-width:0}
  .sched .sch-main b{display:block}
  .sched .sch-main small{display:block;color:var(--muted)}
  .sched.off .sch-main{opacity:.55}
  .sched .sch-act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .sched .sch-act button{min-width:36px;min-height:36px}
  .sch-days{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
  .sch-days label{display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:34px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .sch-days input{display:none}
  .sch-days input:checked+span{font-weight:700;color:var(--accent)}
  .sch-days label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .daily-sum .ds-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0;font-size:13px}
  .daily-sum .ds-row b{font-variant-numeric:tabular-nums}
  .daily-sum table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .daily-sum td,.daily-sum th{padding:4px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
  .daily-sum td:first-child,.daily-sum th:first-child{text-align:left;white-space:normal}
  #budgetBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;font-size:13px;border-bottom:1px solid var(--line);background:color-mix(in srgb,#f0a020 18%,var(--panel))}
  #budgetBar.over{background:color-mix(in srgb,#e5484d 20%,var(--panel))}
  #budgetBar[hidden]{display:none}
  #budgetBar span{flex:1;min-width:12em}
  #budgetBar button{font-size:13px}
  #budgetBar #budgetLater{border:0;background:none;color:var(--muted);font-size:14px}
  .budget-meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
  .budget-meter i{display:block;height:100%;background:var(--accent)}
  .budget-meter.warn i{background:#f0a020}.budget-meter.over i{background:#e5484d}
  .budget-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .budget-row input{width:7em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  .changes h3{margin:0 0 6px;font-size:15px}
  .changes .ch-sum .plus,.changes summary .plus{color:#1a7f37}.changes .ch-sum .minus,.changes summary .minus{color:#cf222e}
  .changes details{border-top:1px solid var(--line)}
  .changes summary{display:flex;gap:8px;align-items:center;padding:8px 2px;cursor:pointer;list-style:none;min-height:36px}
  .changes summary::-webkit-details-marker{display:none}
  .changes summary .ch-path{flex:1;min-width:0;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .changes summary .ch-n{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .changes details[open] summary{font-weight:600}
  .changes .ch-actions{display:flex;gap:8px;margin-top:6px}
  #updateBar span{flex:1}#updateBar a{color:var(--accent);font-weight:600}
  #updateBar button{border:0;background:none;color:var(--muted);font-size:14px}
  #tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs .tab{flex:none;display:flex;align-items:center;gap:6px;max-width:44vw;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px}

  #waitBar{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:color-mix(in srgb,#f0a020 22%,var(--panel));color:var(--text);font:inherit;font-size:13px;text-align:left;cursor:pointer}

  .tts-row{display:flex;align-items:center;gap:8px;margin:8px 0}.tts-row label{flex:1}

  dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--text);width:min(520px,94vw);padding:0 12px;overflow-x:hidden;max-height:88vh;overflow-y:auto;box-sizing:border-box;overscroll-behavior:contain}
  /* iPhone: vh incluye la zona bajo la barra de Safari; dvh es la altura visible real */

<script>
const $ = s => document.querySelector(s);
let log = $('#log');   // chat de la pestaña abierta (cambia al cambiar de pestaña)
const input = $('#input'), dlg = $('#dlg');
let decided = {}, status = {}, es = null, unseen = 0;

// ---------- utilidades ----------
function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(src){  // Markdown mínimo y seguro (escapa primero)
  const blocks=[];
  let s=esc(src).replace(/```[\w+-]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push(c);return '\u0000'+(blocks.length-1)+'\u0000'});
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>')
     .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     .replace(/^#{1,6} (.*)$/gm,'<b>$1</b>')
     .replace(/^[-*] (.*)$/gm,'• $1')
     .replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<pre><code>'+blocks[i]+'</code></pre>');
}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3500)}
function nearBottom(){return log.scrollHeight-log.scrollTop-log.clientHeight<120}
function add(el,force){const stick=force||nearBottom()&&!findOpen();linkify(el);log.appendChild(el);if(stick)log.scrollTop=log.scrollHeight;if(findOpen())findLater()}

// ---------- enlaces a Jira: ABC-123 → https://tu-jira/browse/ABC-123 ----------
const JIRA_RE=/\b([A-Z][A-Z0-9]{1,9})-(\d{1,7})\b/g;
function jiraOk(project){const j=status.jira||{};if(!j.url)return false;
  return j.projects&&j.projects.length?j.projects.includes(project):!(j.exclude||[]).includes(project)}
function jiraLink(key){const a=document.createElement('a');a.className='jira';a.textContent=key;
  a.href=status.jira.url+'/browse/'+encodeURIComponent(key);a.target='_blank';a.rel='noopener noreferrer';
  a.title='Abrir '+key+' en Jira';return a}
function linkify(root){   // recorre solo nodos de texto: no interpreta HTML del mensaje
  if(!root||!(status.jira&&status.jira.url))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentElement;
    if(!p||p.closest('a,pre,button,textarea,input,.diff'))return NodeFilter.FILTER_REJECT;
    if(p.closest('code')){   // en `código` solo si es exactamente una clave
      const t=n.nodeValue.trim(),m=/^([A-Z][A-Z0-9]{1,9})-\d{1,7}$/.exec(t);
      return m&&jiraOk(m[1])?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}
    JIRA_RE.lastIndex=0;return JIRA_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){
    const text=n.nodeValue,frag=document.createDocumentFragment();let last=0,m,changed=false;
    JIRA_RE.lastIndex=0;
    while((m=JIRA_RE.exec(text))){
      if(!jiraOk(m[1]))continue;
      frag.append(text.slice(last,m.index),jiraLink(m[0]));last=m.index+m[0].length;changed=true}
    if(changed){frag.append(text.slice(last));n.replaceWith(frag)}
  }
}
function div(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;return d}
async function api(path,body){
  try{
    const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-CR':'1'},body:JSON.stringify({...(activeTab?{tab:activeTab}:{}),...(body||{})})});
    if(r.status===401){location.reload();return {}}
    const j=await r.json().catch(()=>({}));
    if(r.status===404&&path==='/api/decide'&&body?.ref){dropCard(body.ref,'⌛ Ya no está disponible');toast('Esa decisión ya no está pendiente');return j}
    if(!r.ok&&j.error)toast(j.error);
    return j;
  }catch(e){toast('Sin conexión con el equipo');return {}}
}
function notify(){if(document.hidden){unseen++;document.title=`(${unseen}) Mando`;navigator.vibrate?.(200)}}

// ---------- render ----------
// ---------- indicador "trabajando" ----------
const FRAMES=['·','✢','✳','✶','✻','✽','✻','✶','✳','✢'];
const VERBS=['Pensando','Analizando','Trabajando','Revisando','Razonando','Explorando',
             'Tramando','Cocinando','Hilando','Puliendo','Maquinando','Ensamblando'];
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let wkTimer=null, wkTick=0, clockSkew=0;
const openCards=new Set();   // decisiones esperando respuesta (de todas las sesiones)

// ---------- sesiones en paralelo (pestañas) ----------
// Cada sesión tiene su propio <main>; solo se ve el de la pestaña abierta, que lleva id="log".
let activeTab=''; try{activeTab=localStorage.getItem('cr_tab')||''}catch(_){}
let tabsInfo=[];   // estado de cada sesión, tal como lo envía el servidor
const logs={}, activity={}, lastText={}, unread={}, cardTab={};
const tabName=id=>(tabsInfo.find(t=>t.id===id)||{}).name||'';
const multiTab=()=>tabsInfo.length>1;
function logFor(tab){
  if(!tab)return log;
  if(!logs[tab]){
    const first=$('#log'), free=first&&!Object.values(logs).includes(first);
    const m=free?first:document.createElement('main');
    if(!free){m.hidden=true;$('#working').before(m)}
    logs[tab]=m;
  }
  return logs[tab];
}
function inLog(m,fn){const prev=log;log=m||prev;try{return fn()}finally{log=prev}}
function ensureHint(m){
  if(m.children.length)return;
  const h=div('info hint','Escribe una tarea. Las decisiones aparecerán aquí con botones.');m.appendChild(h);
}
function showTab(tab,{scroll=true}={}){
  if(!tab)return;
  activeTab=tab; try{localStorage.setItem('cr_tab',tab)}catch(_){}
  const m=logFor(tab);
  for(const [k,el] of Object.entries(logs)){el.hidden=k!==tab;if(el.id==='log'&&el!==m)el.removeAttribute('id');el.querySelector('.hint')?.removeAttribute('id')}
  m.id='log'; log=m; unread[tab]=0;
  ensureHint(m); m.querySelector('.hint')?.setAttribute('id','hint');
  setStatus({});
  if(scroll)log.scrollTop=log.scrollHeight;
  if(typeof findOpen==='function'&&findOpen()&&!allTabsMode())findRun();   // la búsqueda sigue en la pestaña nueva
}
function applyTabStatus(){
  if(Array.isArray(status.tabs)){tabsInfo=status.tabs;statusAt=Date.now();if(typeof reconcileCards==='function')setTimeout(reconcileCards,0)}
  if(!tabsInfo.length)return;
  for(const k of Object.keys(logs))if(!tabsInfo.some(t=>t.id===k)){logs[k].remove();delete logs[k]}   // sesión cerrada
  if(!tabsInfo.some(t=>t.id===activeTab)){activeTab=tabsInfo[0].id;showTab(activeTab);return}
  tabsInfo.forEach(t=>logFor(t.id));
  const t=tabsInfo.find(x=>x.id===activeTab);
  Object.assign(status,{busy:t.busy,queued:t.queued||0,cwd:t.cwd,session:t.session,mode:t.mode,model:t.model,pending:t.pending,since:t.since,always:t.always,name:t.name,tab:t.id,engine:t.engine||'claude'});
  const m=logs[activeTab]; if(m&&m.id!=='log'){showTab(activeTab,{scroll:false});return}
  paintTabs();
}
// Decisiones pendientes por pestaña, de la más antigua a la más nueva
function pendingByTab(){
  const m={};
  for(const r of openCards){const t=cardTab[r];if(t)(m[t]=m[t]||[]).push(r)}
  return m;
}
let waitSeen='';   // para desplazar la barra de pestañas solo cuando cambia lo pendiente
function paintTabs(){
  const nav=$('#tabs'); nav.innerHTML='';
  const pend=pendingByTab();
  tabsInfo.forEach(t=>{
    const n=(pend[t.id]||[]).length, waiting=n>0;
    const b=document.createElement('button'); b.className='tab'+(t.id===activeTab?' on':'')+(waiting?' waiting':''); b.dataset.tab=t.id;
    const mark=waiting?`<span class="tmark wait" title="Esperando tu decisión">◆${n>1?n:''}</span>`
      :t.busy?'<span class="tmark busy" title="Trabajando"></span>'
      :unread[t.id]?'<span class="tmark new" title="Novedades">•</span>':'';
    const fc=typeof findCounts!=='undefined'&&allTabsMode()&&findOpen()?findCounts[t.id]:0;

let waitFade=null;
function fadeWaitBar(show){
  const bar=$('#waitBar'); clearTimeout(waitFade);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(show){
    if(!bar.hidden&&!bar.classList.contains('fading'))return;
    bar.hidden=false; void bar.offsetHeight;   // fuerza el estado inicial para que la transición se vea
    bar.classList.remove('fading');
  }else{
    if(bar.hidden)return;
    bar.classList.add('fading');
    waitFade=setTimeout(()=>{bar.hidden=true},reduce?0:360);   // se oculta del todo al terminar el fundido
  }
}
function paintWaitBar(pend=pendingByTab()){
  const bar=$('#waitBar');
  const others=tabsInfo.filter(t=>t.id!==activeTab&&pend[t.id]);
  const show=multiTab()&&others.length>0;
  fadeWaitBar(show);
  const key=others.map(t=>t.id+':'+pend[t.id].length).join(',');
  if(key&&key!==waitSeen){   // algo nuevo: que la pestaña quede a la vista en la barra
    const el=document.querySelector(`#tabs .tab[data-tab="${CSS.escape(others[0].id)}"]`);
    el?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  }
  waitSeen=key;
  if(!show)return;
  const total=others.reduce((a,t)=>a+pend[t.id].length,0);
  $('#waitText').innerHTML='<i aria-hidden="true">◆</i> '+esc(others.length===1
    ?`«${others[0].name}» espera tu decisión`+(total>1?` (${total})`:'')
    :`${others.length} pestañas esperan tu decisión: ${others.map(t=>t.name).join(', ')}`);
  bar.onclick=()=>focusCard(pend[others[0].id][0]);   // la más antigua de la primera pestaña
}

const cardSeen={}; var statusAt=0;   // cuándo llegó el último estado
function dropCard(ref,label){

  decided[ref]=label; openCards.delete(ref); closeCard(ref,label); closeNotif?.(ref);

function reconcileCards(){

    const t=tabsInfo.find(x=>x.id===cardTab[ref]);
    if(!t||!Array.isArray(t.pending_refs)||t.pending_refs.includes(ref))continue;
    if(statusAt>(cardSeen[ref]||0)&&Date.now()-(cardSeen[ref]||0)>4000)dropCard(ref,'⏹️ Ya no está pendiente');

const MAX_COMMENT=2000;
function commentToggle(actions,label,{placeholder,submit,cls,send}){
  const wrap=document.createElement('div');wrap.className='comment';
  const open=document.createElement('button');open.className='link';open.textContent=label;
  wrap.appendChild(open);
  open.onclick=()=>{
    open.hidden=true;
    const ta=document.createElement('textarea');ta.maxLength=MAX_COMMENT;ta.rows=3;ta.placeholder=placeholder;
    const row=div('actions','');
    const ok=document.createElement('button');ok.textContent=submit;ok.className=cls;
    const cancel=document.createElement('button');cancel.textContent='Cancelar';
    const go=async()=>{
      const t=ta.value.trim(); if(!t){ta.focus();return toast('Escribe algo primero')}
      actions.querySelectorAll('button,textarea').forEach(x=>x.disabled=true);
      const j=await send(t);
      if(!j.ok)actions.querySelectorAll('button,textarea').forEach(x=>x.disabled=false);
    };
    ok.onclick=go;
    cancel.onclick=()=>{ta.remove();row.remove();open.hidden=false};
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();go()}});
    row.append(ok,cancel); wrap.append(ta,row); ta.focus();
  };
  return wrap;
}
// Diff estilo GitHub: líneas quitadas en rojo, agregadas en verde, con números de línea
const DIFF_FOLD=30;   // sobre este número de líneas se muestra plegado
function renderDiff(d){
  const box=document.createElement('div');
  box.className='diff'+(d.numbered?'':' nonum');
  const notes=[d.new_file?'archivo nuevo':'', !d.numbered?'sin números de línea (no se pudo leer el archivo)':'', d.truncated?'recortado':''].filter(Boolean);
  box.appendChild(div('diff-head',`<span class="plus">+${d.add}</span> <span class="minus">−${d.del}</span>`+
    (notes.length?` <span class="note">· ${esc(notes.join(' · '))}</span>`:'')));
  const body=document.createElement('div');body.className='diff-body';
  body.innerHTML=d.lines.map(l=>{
    if(l.t==='hunk')return `<div class="dl hunk"><span class="ln"></span><span class="ln"></span><span class="code">${d.numbered?`@@ línea ${l.n} @@`:'⋯'}</span></div>`;
    const sign=l.t==='add'?'+':l.t==='del'?'−':' ';
    return `<div class="dl ${l.t}"><span class="ln">${l.o??''}</span><span class="ln">${l.n??''}</span>`+
           `<span class="code"><span class="sg">${sign}</span>${esc(l.s)}</span></div>`;
  }).join('');
  box.appendChild(body);
  if(d.lines.length>DIFF_FOLD){
    body.classList.add('folded');
    const more=document.createElement('button');more.className='diff-more';
    more.textContent=`Ver todo (${d.lines.length} líneas)`;

function trackWorking(ev){
  const t=ev.tab||activeTab;
  switch(ev.type){
    case 'user': case 'done': case 'error': activity[t]='';break;

    case 'stream': activity[t]='✍️ Escribiendo la respuesta…';break;
    case 'assistant': activity[t]='';lastText[t]=ev.text||'';break;
    case 'perm': case 'question': if(!decided[ev.ref]){openCards.add(ev.ref);cardTab[ev.ref]=t;cardSeen[ev.ref]=Date.now();setTimeout(reconcileCards,5000)}break;
    case 'decided': openCards.delete(ev.ref);break;
  }

}
const OWN_STATE=['status','revoked','reset'];
function render(ev,live){
  if(OWN_STATE.includes(ev.type))return renderIn(ev,live);
  if(!ev.tab){   // global (reglas, 2FA…): se muestra en todas las sesiones
    const all=Object.values(logs);
    if(!all.length)return renderIn(ev,live);
    all.forEach(m=>inLog(m,()=>renderIn(ev,live&&m===logs[activeTab])));
    return;
  }
  inLog(logFor(ev.tab),()=>renderIn(ev,live));
  if(live&&ev.tab!==activeTab&&['assistant','perm','question','done','error'].includes(ev.type))unread[ev.tab]=(unread[ev.tab]||0)+1;
  if(live)paintTabs();
}

    case 'info': add(div('info',esc(ev.text)),live);break;

    case 'done': add(div('done',(ev.ok?'✅ Listo':'⚠️ Terminó con error')+(ev.duration?` · ${fmtElapsed(Math.round(ev.duration))}`:'')+(ev.cost?` · US$${ev.cost.toFixed(4)}`:'')+(ev.tokens?` · ${ktok(ev.tokens)} tokens`:'')),live);if(live){notify();alertDone(ev,ev.ok)}break;
    case 'perm': renderPerm(ev,live);if(live&&!decided[ev.ref])ttsNotice((ev.tool==='ExitPlanMode'?'Claude propone un plan':'Claude necesita tu aprobación')+where(ev)+'.');break;
    case 'question': renderQuestion(ev,live);if(live&&!decided[ev.ref])ttsNotice('Claude tiene una pregunta'+where(ev)+'.');break;

// ---------- buscar en el historial de la pestaña ----------
// Todo en el navegador, sobre lo que ya está cargado: no se envía nada al servidor.
// Ignora mayúsculas y tildes («accion» encuentra «Acción»).
let findHits=[], findTabsOf=[], findIdx=-1, findTimer=null, findCounts={};
let findAll=false; try{findAll=localStorage.getItem('cr_findAll')==='1'}catch(_){}
const allTabsMode=()=>findAll&&multiTab();
const findOpen=()=>!$('#findBar').hidden;
const fold=c=>{const f=c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return f.length===1?f:c.toLowerCase()};
function findClear(){
  document.querySelectorAll('mark.hit').forEach(m=>{const p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize()});
  findHits=[]; findTabsOf=[]; findCounts={};
}
function findRun(keep){
  const q=[...$('#findInput').value.trim()].map(fold).join('');
  const prev=keep&&findHits[findIdx]?findIdx:-1;
  findClear();
  if(q.length<2){findIdx=-1;paintFind();paintTabs();return}
  // En una pestaña o en todas (en el orden de la barra). Las otras están ocultas: ahí se descarta
  // solo lo que esté oculto dentro de la propia conversación (p. ej. un diff plegado).
  const scopes=allTabsMode()?tabsInfo.map(t=>[t.id,logs[t.id]]).filter(([,m])=>m):[[activeTab,log]];
  const nodes=[];
  for(const [tab,m] of scopes){
    const visible=!m.hidden;
    const walker=document.createTreeWalker(m,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
      const p=n.parentElement;
      if(!p||p.closest('button,.qbar,script,style')||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
      if(visible)return p.getClientRects().length?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;   // solo lo visible
      const hid=p.closest('[hidden]');
      return (hid===m||!hid)&&!p.closest('details:not([open]) > :not(summary)')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
    }});
    while(walker.nextNode())nodes.push([tab,walker.currentNode]);
  }
  for(const [tab,n] of nodes){
    const text=n.nodeValue, folded=[...text].map(fold);   // un carácter doblado por cada original
    const chars=[...text]; const parts=[]; let last=0;
    const hay=folded.join('');
    // índices por carácter (no por unidad UTF-16) para no romper emojis
    let i=hay.indexOf(q);
    if(i<0)continue;
    const offs=[];let acc=0;for(const f of folded){offs.push(acc);acc+=f.length}
    const toChar=x=>{let k=offs.findIndex(o=>o>=x);return k<0?chars.length:k};
    while(i>=0){const a=toChar(i),b=toChar(i+q.length);parts.push([a,b]);i=hay.indexOf(q,i+q.length)}
    const frag=document.createDocumentFragment();
    for(const [a,b] of parts){
      if(a>last)frag.appendChild(document.createTextNode(chars.slice(last,a).join('')));
      const m=document.createElement('mark');m.className='hit';m.textContent=chars.slice(a,b).join('');frag.appendChild(m);
      findHits.push(m);findTabsOf.push(tab);findCounts[tab]=(findCounts[tab]||0)+1;last=b;
    }
    if(last<chars.length)frag.appendChild(document.createTextNode(chars.slice(last).join('')));
    n.parentNode.replaceChild(frag,n);
  }
  // por defecto, lo más reciente de la pestaña abierta (o de todas, si ahí no hay)
  const lastHere=findTabsOf.lastIndexOf(activeTab);
  findIdx=findHits.length?(prev>=0?Math.min(prev,findHits.length-1):lastHere>=0?lastHere:findHits.length-1):-1;
  paintFind(!keep);
  paintTabs();   // cuántas coincidencias hay en cada pestaña
}
function paintFind(scroll=true){
  findHits.forEach((m,i)=>m.classList.toggle('cur',i===findIdx));
  const q=$('#findInput').value.trim();
  const where=allTabsMode()&&findTabsOf[findIdx]?` · ${tabName(findTabsOf[findIdx])}`:'';
  $('#findCount').textContent=!q||q.length<2?'':findHits.length?`${findIdx+1}/${findHits.length}${where}`:'0';
  $('#findPrev').disabled=$('#findNext').disabled=findHits.length<2;
  const b=$('#findAll'); b.hidden=!multiTab(); b.setAttribute('aria-pressed',String(findAll));
  b.title=findAll?'Buscando en todas las pestañas (toca para buscar solo en esta)':'Buscar en todas las pestañas';
  if(scroll&&findHits[findIdx]){
    const tab=findTabsOf[findIdx];
    if(tab&&tab!==activeTab)showTab(tab,{scroll:false});   // la coincidencia está en otra pestaña: se abre esa
    findHits[findIdx].scrollIntoView({block:'center'});
  }
}
$('#findAll').onclick=()=>{findAll=!findAll;try{localStorage.setItem('cr_findAll',findAll?'1':'0')}catch(_){};findRun();$('#findInput').focus()};
function findStep(d){if(!findHits.length)return;findIdx=(findIdx+d+findHits.length)%findHits.length;paintFind()}
function findLater(){clearTimeout(findTimer);findTimer=setTimeout(()=>findRun(true),300)}   // llegó algo nuevo
function openFind(){$('#findBar').hidden=false;paintFind(false);const i=$('#findInput');i.focus();i.select();if(i.value)findRun()}
function closeFind(){clearTimeout(findTimer);findClear();$('#findBar').hidden=true;$('#findCount').textContent='';paintTabs()}
$('#findBtn').onclick=()=>findOpen()?closeFind():openFind();
$('#findClose').onclick=closeFind;
$('#findPrev').onclick=()=>findStep(-1);
$('#findNext').onclick=()=>findStep(1);
$('#findInput').addEventListener('input',()=>{clearTimeout(findTimer);findTimer=setTimeout(()=>findRun(),150)});
$('#findInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();clearTimeout(findTimer);if(!findHits.length)findRun();else findStep(e.shiftKey?-1:1)}
  else if(e.key==='Escape'){e.preventDefault();closeFind()}
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='f'&&!document.querySelector('dialog[open]')){e.preventDefault();openFind()}
});

let actx=null, swReg=null, wakeLock=null, reminderTimer=null, reminders=0;
const canNotify=()=>isSecureContext&&'Notification' in window&&'serviceWorker' in navigator;
const notifGranted=()=>canNotify()&&Notification.permission==='granted';

// Los navegadores solo permiten sonido después de un toque del usuario: se desbloquea con el primero
function unlockAudio(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume()}catch(_){}
}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('keydown',unlockAudio);

function chime(){   // dos notas ascendentes, sintetizadas (sin archivos de audio)
  if(!prefs.sound||!actx||actx.state!=='running')return false;
  const t=actx.currentTime;
  [[880,0],[1318.5,.17],[1760,.34]].forEach(([f,dt],i)=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+dt);
    g.gain.exponentialRampToValueAtTime(i===2?.22:.3,t+dt+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dt+(i===2?.9:.45));
    o.connect(g).connect(actx.destination);o.start(t+dt);o.stop(t+dt+1);
  });
  return true;
}

async function setupSW(){
  if(!('serviceWorker' in navigator)||!isSecureContext)return;
  try{swReg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready}catch(_){}
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='focus-card')focusCard(e.data.ref)});
}
async function requestNotifications(){
  if(!canNotify())return 'unsupported';
  let p=Notification.permission;
  if(p==='default')p=await Notification.requestPermission();
  if(p==='granted'&&!swReg)await setupSW();
  return p;
}
function focusCard(ref){
  if(cardTab[ref]&&cardTab[ref]!==activeTab)showTab(cardTab[ref],{scroll:false});   // la tarjeta es de otra sesión
  const c=document.getElementById('d-'+ref);
  if(c){c.scrollIntoView({behavior:'smooth',block:'center'});
        c.animate([{outlineColor:'transparent'},{outline:'2px solid var(--accent)'},{outlineColor:'transparent'}],{duration:900})}
}

function sysNotify(ev){
  if(!prefs.notify||!notifGranted()||!swReg)return;
  if(document.visibilityState==='visible'&&document.hasFocus())return;   // ya la estás viendo
  const perm=ev.type==='perm';
  const body=perm?(prefs.detail?`${ev.title}\n${(ev.detail||'').slice(0,140)}`:ev.title)
                 :(prefs.detail?ev.question:ev.header);
  const pre=multiTab()&&ev.tab?`[${tabName(ev.tab)}] `:'';
  swReg.showNotification(pre+(perm?'Claude pide permiso':'Claude tiene una pregunta'),{
    body, tag:'cr-'+ev.ref, renotify:true, requireInteraction:true,
    icon:'/icon.svg', badge:'/icon.svg', vibrate:[200,100,200,100,200],
    data:{ref:ev.ref},
    actions:perm?[{action:'y',title:'✅ Aprobar'},{action:'n',title:'❌ Rechazar'}]:[],
  }).catch(()=>{});
}
function chimeDone(ok){   // dos notas descendentes: distinto al aviso de decisión
  if(!prefs.sound||!actx||actx.state!=='running')return false;
  const t=actx.currentTime, notes=ok?[[1318.5,0],[987.8,.2]]:[[659.3,0],[523.3,.22]];
  notes.forEach(([f,dt])=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=ok?'sine':'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+dt);g.gain.exponentialRampToValueAtTime(.22,t+dt+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dt+.6);
    o.connect(g).connect(actx.destination);o.start(t+dt);o.stop(t+dt+.7);
  });
  return true;
}
// Aviso al terminar una tarea larga (umbral configurable en 🔔 Alertas)
function alertDone(ev,ok){
  const secs=Math.round(ev.duration||0);
  if(prefs.doneAfter<0||secs<prefs.doneAfter)return;
  chimeDone(ok); navigator.vibrate?.(ok?[120,80,120]:[300]);
  if(!prefs.notify||!notifGranted()||!swReg)return;
  if(document.visibilityState==='visible'&&document.hasFocus())return;
  const resumen=(lastText[ev.tab||activeTab]||'').replace(/[`*#>]/g,'').replace(/\s+/g,' ').trim().slice(0,140);
  swReg.showNotification((multiTab()&&ev.tab?`[${tabName(ev.tab)}] `:'')+(ok?'✅ Claude terminó':'⚠️ Claude terminó con error'),{
    body:prefs.detail&&resumen?resumen:`Duró ${fmtElapsed(secs)}. Toca para ver el resultado.`,
    tag:'cr-done', renotify:true, icon:'/icon.svg', badge:'/icon.svg', vibrate:[120,80,120],
  }).catch(()=>{});
}
// Al volver a la app, el aviso de «terminó» ya no hace falta
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')
    swReg?.getNotifications({tag:'cr-done'}).then(ns=>ns.forEach(n=>n.close())).catch(()=>{});
});
function closeNotif(ref){
  swReg?.getNotifications({tag:'cr-'+ref}).then(ns=>ns.forEach(n=>n.close())).catch(()=>{});
}

// Llamada al llegar una decisión nueva en vivo (no al recargar el historial)
function alertDecision(ev){
  chime(); navigator.vibrate?.([200,100,200]); sysNotify(ev);
  reminders=0; clearInterval(reminderTimer);
  // recordatorio cada 30 s mientras siga pendiente (máx. 4 veces)
  reminderTimer=setInterval(()=>{
    if(!openCards.size||++reminders>4){clearInterval(reminderTimer);return}
    chime(); navigator.vibrate?.(200);
  },30000);
}

// Mantener la pantalla encendida mientras trabaja: con el teléfono bloqueado el
// navegador congela la página y ya no puede sonar ni notificar.
async function syncWakeLock(){
  try{
    const want=prefs.wake&&(status.busy||tabsInfo.some(t=>t.busy))&&document.visibilityState==='visible'&&'wakeLock' in navigator;
    if(want&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}
    else if(!want&&wakeLock){await wakeLock.release();wakeLock=null}
  }catch(_){wakeLock=null}
}
document.addEventListener('visibilitychange',syncWakeLock);

function ago(t){
  const s=Math.max(0,Math.round(Date.now()/1000+clockSkew-t));
  if(s<60)return 'ahora';if(s<3600)return `hace ${Math.round(s/60)} min`;

}

// ---------- auditoría ----------
function auditText(e){
  const t=x=>esc(String(x??''));
  switch(e.event){
    case 'login':return `🔓 Inicio de sesión (${t(e.via)})`;
    case 'login_failed':return `⚠️ ${e.reason?t(e.reason):'Token incorrecto'}${e.via?` (${t(e.via)})`:''}`;
    case 'login_blocked':return '⛔ Login bloqueado por demasiados intentos';
    case 'logout':return '🚪 Cierre de sesión';
    case 'session_revoked':return `🔒 Sesión cerrada: ${t(e.target)}`;
    case 'sessions_revoked':return `🔒 Sesiones cerradas: ${t(e.count)}`;
    case 'token_rotated':return `🔑 Token rotado (${t(e.closed)} sesiones cerradas)`;
    case 'task':return `📝 Tarea: ${t(e.prompt)}`;
    case 'decision':return `🛂 ${t(e.result)} · <code>${t(e.target)}</code>`;
    case 'answer':return `❓ ${t(e.question)} → ${t(e.answer)}`;
    case 'auto_approved':return `⚖️ Aprobado por regla ${t(e.rule)} · <code>${t(e.target)}</code>`;
    case 'blocked':return `⛔ Bloqueado por regla ${t(e.rule)} · <code>${t(e.target)}</code>`;
    case 'tool':return `› <code>${t(e.target)}</code>`;
    case 'mode':return `🔀 Modo: ${t((MODES[e.mode]||{}).label||e.mode)}`;
    case 'model':return `🧠 Modelo: ${t(modelLabel(e.model))}`;
    case 'rule_add':return `⚖️ Regla agregada (${e.action==='deny'?'bloquear':'aprobar'}): ${t(e.rule)}`;
    case 'rule_del':return `⚖️ Regla eliminada: ${t(e.rule)}`;
    case 'stop':return '⏹️ Tarea detenida';
    case 'new_session':return '🆕 Sesión nueva';
    case 'resume':return `🔁 Sesión retomada ${t(String(e.claude_session||'').slice(0,8))}`;
    case 'cd':return `📁 Carpeta: ${t(e.cwd)}`;
    case 'history_cleared':return '🧹 Historial del chat borrado';
    case 'totp_enabled':return `📱 Segundo factor activado (${t(e.closed)} sesiones cerradas)`;
    case 'totp_disabled':return '📱 Segundo factor desactivado';
    case 'totp_failed':return `⚠️ Código 2FA incorrecto al ${t(e.step)}`;
    default:return t(e.event);
  }
}

// ---------- Web Push: avisos con la app cerrada ----------
const b64uBytes=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const canPush=()=>isSecureContext&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function paintPush(){
  const box=$('#pushBox'); if(!box)return;
  const head=`<h4>📲 Avisos con la app cerrada</h4>`;
  const ios=/iPhone|iPad/.test(navigator.userAgent), standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!canPush()){
    box.innerHTML=head+`<p class="note">${!isSecureContext?'Necesitan HTTPS (ver README).':ios&&!standalone?'En iPhone: agrega esta página a la pantalla de inicio (Compartir → Agregar a inicio), ábrela desde ahí y vuelve aquí.':'Este navegador no los soporta.'}</p>`;
    return;
  }
  const j=await api('/api/cmd',{cmd:'push_status'}); if(!j.ok)return;
  if(!j.enabled){box.innerHTML=head+`<p class="note">${esc(j.reason||'Desactivados en este PC.')}</p>`;return}
  const reg=swReg||await navigator.serviceWorker.ready, local=await reg.pushManager.getSubscription().catch(()=>null);
  const on=j.subscribed&&!!local;
  box.innerHTML=head+`<p class="note">Llegan aunque cierres la app o bloquees el teléfono: «Claude necesita tu decisión» y «Claude terminó» (tareas de más de 30 s). Para eso el aviso pasa por el servicio de notificaciones del navegador (Apple, Google…), en internet: va <b>cifrado</b> y es <b>genérico</b>, sin comandos, archivos ni textos. Si tienes la app abierta, avisa la página y no llega el push.</p>
    <div class="sec-actions"><button id="pushToggle">${on?'Desactivar en este dispositivo':'Activar en este dispositivo'}</button>${on?'<button id="pushTest">Probar</button>':''}</div>`;
  $('#pushToggle').onclick=async()=>{
    $('#pushToggle').disabled=true;
    try{
      if(on){await local?.unsubscribe().catch(()=>{});await api('/api/cmd',{cmd:'push_unsubscribe'});toast('Avisos desactivados en este dispositivo')}
      else{
        if(await Notification.requestPermission()!=='granted'){toast('Permiso de notificaciones denegado');return}
        const key=b64uBytes(j.key);
        let sub=local;
        if(sub&&sub.options?.applicationServerKey&&new Uint8Array(sub.options.applicationServerKey).join()!==key.join()){await sub.unsubscribe();sub=null}
        sub=sub||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
        const r=await api('/api/cmd',{cmd:'push_subscribe',sub:sub.toJSON()});
        if(r.ok)toast('Avisos activados: prueba con «Probar»');
      }
    }catch(e){toast('No se pudo: '+(e.message||e))}
    finally{paintPush()}
  };

// ---------- sincronización en vivo entre dispositivos ----------
// 1) SSE con latido visible: si pasan STALE_MS sin datos, la conexión murió en silencio
//    (pantalla bloqueada, cambio de Wi-Fi) y se reconecta sola.
// 2) Si el flujo SSE nunca llega (proxy/antivirus que lo retiene), se cambia a long-polling.
// 3) Al volver a la pestaña, recuperar la red o restaurar la página, se resincroniza.
// 4) Cada evento tiene id: no se duplica ni se pierde nada entre reconexiones.
const STALE_MS=25000, FIRST_MS=8000;
let mode='sse', lastId=0, lastSeen=0, connOk=false, gotFirst=false, sseFails=0,
    firstTimer=null, hiddenAt=0, pollCtl=null, polling=false, kick=false;

function paintDot(){
  const d=$('#dot');
  d.className=!connOk?'off':(status.busy?'busy':'idle');
  d.title=connOk?`conectado (${mode==='sse'?'tiempo real':'sondeo'})`:'reconectando…';
}
function alive(){lastSeen=Date.now(); if(!connOk){connOk=true;paintDot()}}
function down(){if(connOk){connOk=false;paintDot()}}

function applySnapshot(s){
  [log,...Object.values(logs)].forEach(m=>m.innerHTML='');decided={};openCards.clear();
  for(const o of [activity,lastText,cardTab])for(const k in o)delete o[k];
  setStatus(s.status);   // crea las pestañas antes de repartir el historial
  s.history.filter(e=>e.type==='decided').forEach(e=>decided[e.ref]=e.label);
  s.history.forEach(e=>{if(e.type!=='decided')render(e,false)});
  (s.streams||[]).forEach(st=>inLog(logFor(st.tab),()=>renderStream(st,false)));   // respuestas a medio escribir
  lastId=s.seq; setStatus({});
  Object.values(logs).forEach(m=>{ensureHint(m);m.scrollTop=m.scrollHeight});
  log.querySelector('.hint')?.setAttribute('id','hint');
  if(location.hash.startsWith('#d-')){const r=location.hash.slice(3);history.replaceState(null,'','/');setTimeout(()=>focusCard(r),100)}
}
function handle(ev){
  if(ev.type==='snapshot')return applySnapshot(ev);
  if(ev.type==='batch'){ev.events.forEach(handle);lastId=Math.max(lastId,ev.seq);if(ev.status)setStatus(ev.status);
    (ev.streams||[]).forEach(st=>inLog(logFor(st.tab),()=>renderStream(st,true)));return}
  if(ev.id){if(ev.id<=lastId)return;lastId=ev.id}   // descarta duplicados
  render(ev,true);
}

function stopSSE(){if(es){es.close();es=null}clearTimeout(firstTimer)}
function startSSE(){
  stopSSE(); gotFirst=false;
  es=new EventSource('/events');
  es.onmessage=m=>{gotFirst=true;sseFails=0;alive();handle(JSON.parse(m.data))};
  es.addEventListener('ping',()=>{gotFirst=true;alive()});
  es.onerror=()=>{down();checkAuth()};   // reintenta solo; si la sesión ya no existe, al login
  firstTimer=setTimeout(()=>{
    if(gotFirst)return;
    if(++sseFails>=2){mode='poll';stopSSE();pollLoop()} else startSSE();
  },FIRST_MS);
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pollLoop(){
  if(polling)return; polling=true; paintDot();
  while(mode==='poll'){
    pollCtl=new AbortController(); const t=setTimeout(()=>pollCtl.abort(),35000);
    try{
      const r=await fetch('/api/poll?after='+lastId,{signal:pollCtl.signal,cache:'no-store'});
      if(r.status===401){location.reload();return}
      if(!r.ok)throw new Error(r.status);
      alive(); handle(await r.json());
    }catch(e){
      if(kick){kick=false;continue}
      down(); await sleep(2000);
    }finally{clearTimeout(t)}
  }
  polling=false;
}

function resync(){
  lastSeen=Date.now();   // margen para que la nueva conexión llegue antes del próximo chequeo
  if(mode==='sse')startSSE();
  else{kick=true;pollCtl?.abort()}
}
// watchdog: en sondeo cada respuesta puede tardar hasta 25 s, por eso más margen
setInterval(()=>{if(Date.now()-lastSeen>(mode==='sse'?STALE_MS:45000)){down();resync()}},5000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  unseen=0;document.title='Mando';
  if(Date.now()-hiddenAt>3000||!connOk)resync();
});
window.addEventListener('online',resync);
window.addEventListener('pageshow',e=>{if(e.persisted)resync()});

startSSE();

async function send(textOverride){

// ---------- capturas adjuntas ----------
// Se reducen en el navegador (máx. 2000 px) y van a Claude sin guardarse en el PC; en el chat queda una miniatura.
const MAX_ATTACH=5, MAX_SIDE=2000, MAX_BYTES=4.5*1024*1024;
let attached=[], sending=false;
const blobB64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(b)});
const canvasBlob=(c,type,q)=>new Promise(ok=>c.toBlob(ok,type,q));
async function prepImage(file){
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1,MAX_SIDE/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const keep=scale===1&&/^image\/(png|jpeg|gif|webp)$/.test(file.type)&&file.size<=MAX_BYTES&&file.size<1.5*1024*1024;
  let blob=keep?file:await canvasBlob(c,file.type==='image/png'?'image/png':'image/jpeg',0.88);
  if(blob.size>MAX_BYTES)blob=await canvasBlob(c,'image/jpeg',0.8);   // capturas PNG muy grandes
  if(blob.size>MAX_BYTES)throw new Error('La imagen es demasiado grande');
  const t=document.createElement('canvas'), ts=Math.min(1,200/Math.max(c.width,c.height));
  t.width=Math.max(1,Math.round(c.width*ts)); t.height=Math.max(1,Math.round(c.height*ts));
  const tx=t.getContext('2d'); tx.fillStyle='#fff'; tx.fillRect(0,0,t.width,t.height); tx.drawImage(c,0,0,t.width,t.height);
  const thumb=await canvasBlob(t,'image/jpeg',0.7);
  bmp.close?.();
  return {media_type:blob.type,data:await blobB64(blob),thumb:await blobB64(thumb),url:URL.createObjectURL(thumb)};
}
// Archivos de texto: se leen en el navegador; el contenido va solo a Claude
const MAX_TEXT_FILES=5, MAX_TEXT_BYTES=200*1024;
const TEXT_EXT=/\.(log|txt|md|json|csv|tsv|ya?ml|xml|html?|css|m?[jt]sx?|py|java|kt|go|rs|rb|php|cs|c|h|cpp|sql|sh|ps1|bat|ini|cfg|conf|toml|properties|gradle|diff|patch)$/i;
const SECRET_FILE=/(^\.env(\..*)?$|\.(pem|key|p12|pfx|jks|keystore|kdbx)$|^id_(rsa|dsa|ecdsa|ed25519)(\.pub)?$|^\.?netrc$|^\.npmrc$|^\.pypirc$|^credentials(\.json)?$)/i;
let attachedTexts=[];
const isText=f=>f.type.startsWith('text/')||/^application\/(json|xml|x-yaml|yaml|x-sh|javascript|sql)/.test(f.type)||TEXT_EXT.test(f.name);
async function addTextFile(f){
  if(attachedTexts.length>=MAX_TEXT_FILES){toast(`Máximo ${MAX_TEXT_FILES} archivos de texto por tarea`);return}
  if(SECRET_FILE.test(f.name)){toast(`«${f.name}» parece un archivo de secretos: no se adjunta`);return}
  if(f.size>MAX_TEXT_BYTES){toast(`«${f.name}» supera los ${MAX_TEXT_BYTES/1024} KB`);return}
  const text=await f.text();
  if(text.includes('\u0000')){toast(`«${f.name}» no es un archivo de texto`);return}
  attachedTexts.push({name:f.name,text,bytes:new Blob([text]).size});
}
async function addFiles(files){
  const all=[...files].filter(Boolean);
  for(const f of all.filter(f=>!f.type.startsWith('image/'))){
    if(SECRET_FILE.test(f.name))toast(`«${f.name}» parece un archivo de secretos: no se adjunta`);
    else if(isText(f))await addTextFile(f); else toast(`«${f.name}»: solo se pueden adjuntar imágenes o archivos de texto`);
  }
  let imgs=all.filter(f=>f.type.startsWith('image/'));
  if(imgs.length&&!caps().images){toast(`${agentName()} no admite capturas en Mando (sí archivos de texto)`);imgs=[]}
  for(const f of imgs){
    if(attached.length>=MAX_ATTACH){toast(`Máximo ${MAX_ATTACH} capturas por tarea`);break}
    try{attached.push(await prepImage(f))}catch(e){toast('No se pudo usar la imagen: '+(e.message||e))}
  }
  paintAttachments();
}
function clearAttachments(){attached.forEach(a=>URL.revokeObjectURL(a.url));attached=[];attachedTexts=[];paintAttachments()}
function paintAttachments(){
  const bar=$('#attachBar'); bar.hidden=!attached.length&&!attachedTexts.length; bar.innerHTML='';
  attachedTexts.forEach((f,i)=>{const d=document.createElement('div');d.className='att file';
    d.innerHTML=`📄 <span>${esc(f.name)}</span><small>${kb(f.bytes)}</small><button aria-label="Quitar ${esc(f.name)}">✕</button>`;
    d.querySelector('button').onclick=()=>{attachedTexts.splice(i,1);paintAttachments()};bar.appendChild(d)});
  attached.forEach((a,i)=>{const d=document.createElement('div');d.className='att';
    d.innerHTML=`<img src="${a.url}" alt="Captura ${i+1}"><button aria-label="Quitar captura ${i+1}">✕</button>`;
    d.querySelector('button').onclick=()=>{URL.revokeObjectURL(a.url);attached.splice(i,1);paintAttachments()};bar.appendChild(d)});
  if(attached.length||attachedTexts.length){const n=document.createElement('span');n.className='count';
    n.textContent=(attached.length?`${attached.length}/${MAX_ATTACH} · `:'')+'se envían con la tarea';bar.appendChild(n)}
}
$('#attachBtn').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{addFiles(e.target.files);e.target.value=''};
input.addEventListener('paste',e=>{   // Ctrl+V de una captura en el PC
  const files=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile());
  if(files.length){e.preventDefault();addFiles(files)}
});
document.addEventListener('dragover',e=>{if([...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();document.body.classList.add('dropping')}});

// ---------- comandos «/» de Claude Code (integrados, .claude/commands, skills, MCP) ----------
let commands=null, cmdCwd=null, cmdLoading=false, cmdError='', cmdSel=0, cmdItems=[], cmdDismissed=null;
function cmdQuery(){const m=/^\/(\S*)$/.exec(input.value);return m?m[1].toLowerCase():null}
async function loadCommands(){
  cmdLoading=true; cmdError='';
  const j=await api('/api/cmd',{cmd:'commands'}); cmdLoading=false;
  if(j.commands){commands=j.commands;cmdCwd=j.cwd}else{commands=[];cmdCwd=status.cwd;cmdError=j.error||'No se pudo obtener la lista'}
  paintCommands();
}
function paintCommands(){
  if(!caps().commands){$('#cmdList').hidden=true;cmdItems=[];return}
  const box=$('#cmdList'), q=cmdQuery();
  if(q===null||input.value===cmdDismissed){box.hidden=true;cmdItems=[];return}
  box.hidden=false;
  if(commands===null||(cmdCwd!==status.cwd&&!cmdLoading)){
    if(!cmdLoading)loadCommands();
    box.innerHTML='<div class="cmd-note">Cargando los comandos de Claude…</div>';cmdItems=[];return}
  if(cmdLoading){box.innerHTML='<div class="cmd-note">Cargando los comandos de Claude…</div>';cmdItems=[];return}
  const low=c=>c.name.toLowerCase();
  cmdItems=[...commands.filter(c=>low(c).startsWith(q)),
            ...commands.filter(c=>!low(c).startsWith(q)&&(low(c).includes(q)||c.description.toLowerCase().includes(q)))].slice(0,60);
  if(!cmdItems.length){box.innerHTML=`<div class="cmd-note">${esc(cmdError||'Ningún comando coincide')}</div>`;return}
  cmdSel=Math.min(cmdSel,cmdItems.length-1);
  box.innerHTML='';
  cmdItems.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='cmd'+(i===cmdSel?' sel':'');
    b.dataset.cmdName=c.name;b.setAttribute('role','option');b.setAttribute('aria-selected',i===cmdSel);
    b.innerHTML=`<b>/${esc(c.name)}</b>${c.hint?` <span class="hint">${esc(c.hint)}</span>`:''}${c.description?`<small>${esc(c.description)}</small>`:''}`;
    b.onmousedown=e=>e.preventDefault();   // no quitar el foco del cuadro
    b.onclick=()=>pickCommand(c);box.appendChild(b)});
  box.querySelector('.sel')?.scrollIntoView({block:'nearest'});
}
function pickCommand(c){
  input.value='/'+c.name+' '; autosize(); cmdItems=[]; $('#cmdList').hidden=true; paintTemplates();
  input.focus(); input.setSelectionRange(input.value.length,input.value.length);
  if(c.hint)toast(`/${c.name} ${c.hint}`);
}
input.addEventListener('keydown',e=>{   // en captura: antes que «Enter envía»
  if($('#cmdList').hidden)return;
  if(e.key==='Escape'){e.preventDefault();cmdDismissed=input.value;paintCommands();return}
  if(!cmdItems.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
    cmdSel=(cmdSel+(e.key==='ArrowDown'?1:cmdItems.length-1))%cmdItems.length;paintCommands()}
  else if(e.key==='Tab'||(e.key==='Enter'&&!e.shiftKey)){e.preventDefault();e.stopImmediatePropagation();pickCommand(cmdItems[cmdSel])}
},true);

// ---------- respuestas habladas (síntesis de voz del dispositivo, solo voces locales) ----------
const synth=window.speechSynthesis;
const TTS_MAX=1500;   // más largo: se lee el comienzo y se avisa que sigue en pantalla
// Solo voces que se generan en el dispositivo: las «remotas» (p. ej. «Google español» en Chrome)
// envían el texto a servidores externos.
function ttsVoices(){
  const all=(synth&&synth.getVoices())||[], local=all.filter(v=>v.localService);
  const es=local.filter(v=>/^es/i.test(v.lang));
  return es.length?es:local;
}
function ttsVoice(){const vs=ttsVoices();return vs.find(v=>v.voiceURI===prefs.ttsVoice)||vs.find(v=>/^es[-_]?(cl|419|mx|us)/i.test(v.lang))||vs[0]||null}
function speechText(t){
  t=String(t||'')
    .replace(/```[\s\S]*?```/g,' (bloque de código). ')
    .replace(/`([^`]*)`/g,'$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
    .replace(/https?:\/\/\S+/g,'enlace')
    .replace(/^\s{0,3}#{1,6}\s*/gm,'')
    .replace(/^\s*[-*+]\s+/gm,'')
    .replace(/^\s*>\s?/gm,'')
    .replace(/^[ \t]*\|?[-:| ]+\|[-:| ]*$/gm,'')
    .replace(/^[ \t]*\|(.*?)\|?[ \t]*$/gm,'$1').replace(/[ \t]*\|[ \t]*/g,', ')
    .replace(/(\*\*|~~)(\S[\s\S]*?)\1/g,'$2').replace(/\*(\S[^*\n]*?)\*/g,'$1')   // sin tocar los _ de nombres_de_variables
    .replace(/\s*\n+\s*/g,'. ').replace(/(\.\s*){2,}/g,'. ').replace(/\s{2,}/g,' ').trim();
  if(t.length>TTS_MAX)t=t.slice(0,t.lastIndexOf(' ',TTS_MAX))+'… La respuesta continúa en pantalla.';
  return t;
}
function ttsChunks(t){   // frases cortas: Chrome corta las locuciones largas a los ~15 s
  const out=[];let cur='';
  const parts=(t.match(/[^.!?;:]+[.!?;:]*\s*/g)||[t]).flatMap(p=>p.length>220?p.match(/\S+\s*/g):[p]);
  for(const part of parts){
    if((cur+part).length>220&&cur){out.push(cur.trim());cur=''}
    cur+=part;
  }
  if(cur.trim())out.push(cur.trim());
  return out;
}
function ttsPaint(){
  const b=$('#ttsBtn'); if(!b)return;
  b.hidden=!synth; b.classList.toggle('on',!!prefs.tts); b.textContent=prefs.tts?'🔊':'🔇';
  b.setAttribute('aria-pressed',prefs.tts?'true':'false');
  b.title=prefs.tts?'Respuestas habladas: activadas (toca para apagar)':'Respuestas habladas: apagadas (toca para activar)';
}
function ttsTalking(){$('#ttsBtn')?.classList.toggle('talking',!!(synth&&(synth.speaking||synth.pending)))}
function ttsSpeak(text,force){
  if(!synth||!(prefs.tts||force))return;
  const v=ttsVoice(); if(!v){toast('No hay voces locales en este dispositivo');return}
  for(const c of ttsChunks(text)){
    const u=new SpeechSynthesisUtterance(c); u.voice=v; u.lang=v.lang; u.rate=+prefs.ttsRate||1;
    u.onstart=u.onend=u.onerror=ttsTalking; synth.speak(u);
  }
  ttsTalking();
}
function ttsSay(md){const t=speechText(md);if(t)ttsSpeak(t)}
function ttsNotice(t){if(prefs.ttsDecisions)ttsSpeak(t)}
function ttsStop(){if(synth){synth.cancel();ttsTalking()}}
function ttsToggle(on){
  prefs.tts=on; savePrefs(); ttsPaint();
  if(on)ttsSpeak('Respuestas habladas activadas.',true);   // dentro del toque: iPhone exige un gesto para hablar
  else ttsStop();
}
if(synth){synth.addEventListener?.('voiceschanged',()=>{ttsPaint()});ttsPaint()}
$('#ttsBtn').onclick=()=>ttsToggle(!prefs.tts);

// ---------- voz ----------
// Whisper: el navegador graba y el audio va solo a tu PC. Navegador: Google/Apple transcriben (sale a internet).
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MAX_REC_MS=120000;
let rec=null;   // grabación en curso: {kind, stop(), t0, timer}
const canRecord=()=>isSecureContext&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
function voiceKind(){
  const srv=status.voice||'off';
  if(srv==='off')return null;
  if(prefs.voice==='browser'&&SR)return 'browser';
  if(srv==='whisper'&&canRecord())return 'whisper';
  if(prefs.voice!=='whisper'&&SR&&isSecureContext)return 'browser';   // «Solo Whisper» nunca usa el navegador
  return null;
}
function paintMic(){
  const b=$('#mic'); b.hidden=(status.voice||'off')==='off';
  b.title=voiceKind()==='browser'?'Dictar (navegador: el audio sale a internet)':'Dictar por voz (se transcribe en tu PC)';
}
function insertText(t,base){
  t=(t||'').trim(); const b=base??input.value;
  input.value=t?(b&&!/\s$/.test(b)?b+' ':b)+t:b; autosize();
}
function recTick(){
  const secs=Math.floor((Date.now()-rec.t0)/1000);
  input.placeholder=`🔴 Grabando ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  if(Date.now()-rec.t0>MAX_REC_MS)rec.stop();
}
function recEnd(){
  if(rec)clearInterval(rec.timer); rec=null; paintTemplates();
  $('#mic').classList.remove('rec'); $('#mic').textContent='🎤';
  input.placeholder=idlePlaceholder();
}
function recStart(kind,stop){
  rec={kind,stop,t0:Date.now(),timer:null}; rec.timer=setInterval(recTick,500); recTick(); paintTemplates();
  const b=$('#mic'); b.classList.add('rec'); b.textContent='⏹';
}
async function startWhisper(){
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast('Sin acceso al micrófono: revisa el permiso del navegador');return}
  const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported?.(t))||'';
  const mr=new MediaRecorder(stream,type?{mimeType:type}:undefined), chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop()); recEnd();
    const blob=new Blob(chunks,{type:(mr.mimeType||type||'audio/webm').split(';')[0]});
    if(blob.size<1000){toast('No se grabó audio');return}
    const b=$('#mic'); b.classList.add('busy'); b.disabled=true; b.textContent='⏳'; input.placeholder='Transcribiendo en tu PC…';
    try{
      const r=await fetch('/api/transcribe',{method:'POST',headers:{'X-CR':'1','Content-Type':blob.type},body:blob});
      const j=await r.json().catch(()=>({}));
      if(r.ok){insertText(j.text);if(!j.text)toast('No se entendió nada; intenta de nuevo');input.focus()}
      else toast(j.error||`Error ${r.status} al transcribir`);
    }catch(_){toast('Sin conexión con el PC')}
    finally{b.classList.remove('busy');b.disabled=false;b.textContent='🎤';input.placeholder=idlePlaceholder()}
  };
  mr.start(1000);
  recStart('whisper',()=>{if(mr.state!=='inactive')mr.stop()});
}
function startBrowser(){
  if(!prefs.voiceBrowserOk){
    if(!confirm('El dictado del navegador envía tu voz a los servidores de Google o Apple para transcribirla.\n\nNo dictes información interna o confidencial. ¿Continuar?'))return;
    prefs.voiceBrowserOk=true; savePrefs();
  }
  const r=new SR(), base=input.value; let finals='';
  r.lang=navigator.language||'es-CL'; r.interimResults=true; r.continuous=true;
  r.onresult=e=>{let tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];
    if(x.isFinal)finals+=x[0].transcript+' ';else tmp+=x[0].transcript}
    insertText(finals+tmp,base)};
  r.onerror=e=>{if(e.error!=='aborted'&&e.error!=='no-speech')toast('Dictado: '+e.error)};
  r.onend=()=>{recEnd();input.focus()};
  try{r.start()}catch(_){toast('No se pudo iniciar el dictado');return}
  recStart('browser',()=>r.stop());
}
$('#mic').onclick=()=>{
  if(rec){rec.stop();return}
  const k=voiceKind();
  if(k==='whisper')startWhisper();
  else if(k==='browser')startBrowser();
  else voiceDialog();
};
function ttsSection(){
  if(!synth)return '<p class="note">Este navegador no puede leer en voz alta.</p>';
  const vs=ttsVoices(), cur=ttsVoice();
  if(!vs.length)return '<p class="note warn">No hay voces locales en este dispositivo. Las voces en línea no se usan, porque enviarían el texto a servidores externos.</p>';
  return `<p class="note">Lee en voz alta las respuestas de Claude en este dispositivo. Se activa y apaga con 🔇/🔊 arriba. Solo se usan voces del dispositivo: el texto no sale de tu red.</p>
    <div class="tts-row"><label for="ttsOn">Activadas</label><input type="checkbox" id="ttsOn" ${prefs.tts?'checked':''}></div>
    <div class="tts-row"><label for="ttsVoiceSel">Voz</label><select id="ttsVoiceSel">${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&v.voiceURI===cur.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>
    <div class="tts-row"><label for="ttsRate">Velocidad <span id="ttsRateV">${(+prefs.ttsRate).toFixed(1)}×</span></label><input type="range" id="ttsRate" min="0.7" max="1.8" step="0.1" value="${prefs.ttsRate}"></div>
    <div class="tts-row"><label for="ttsDec">Avisar también las decisiones y preguntas</label><input type="checkbox" id="ttsDec" ${prefs.ttsDecisions?'checked':''}></div>
    <div class="sec-actions"><button id="ttsTest">▶️ Probar</button></div>`;
}
function ttsBind(){
  const on=$('#ttsOn'); if(!on)return;
  on.onchange=()=>ttsToggle(on.checked);
  $('#ttsVoiceSel').onchange=e=>{prefs.ttsVoice=e.target.value;savePrefs()};
  $('#ttsRate').oninput=e=>{prefs.ttsRate=+e.target.value;$('#ttsRateV').textContent=prefs.ttsRate.toFixed(1)+'×';savePrefs()};
  $('#ttsDec').onchange=e=>{prefs.ttsDecisions=e.target.checked;savePrefs()};
  $('#ttsTest').onclick=()=>{ttsStop();ttsSpeak('Hola, así suenan las respuestas de Claude.',true)};
}
function voiceDialog(){
  const srv=status.voice||'off', secure=isSecureContext;
  const estado=srv==='whisper'?'✅ Whisper instalado en tu PC: el audio se transcribe ahí y no sale a internet.'
    :srv==='browser'?'Whisper no está instalado en el PC. Se puede usar el dictado del navegador (el audio pasa por Google o Apple).'
    :'La voz está desactivada en el servidor (VOICE_ENGINE).';
  const opts=[['auto','Automático','Whisper si está instalado; si no, el navegador'],
              ['whisper','Solo Whisper','Nunca envía audio fuera de tu red'],
              ['browser','Navegador','Google o Apple transcriben: el audio sale a internet']];
  showDialog(`<h3>🎤 Voz</h3><p class="note">${estado}</p>
    ${secure?'':'<p class="note warn">El micrófono necesita HTTPS: configura los certificados (README, «Notificaciones en el teléfono»).</p>'}
    ${srv==='off'?'':'<h4>Qué usar en este dispositivo</h4><div id="voiceOpts"></div>'}
    <p class="note">Toca 🎤, habla y vuelve a tocar para terminar (máximo 2 min). El texto aparece en el cuadro para que lo revises antes de enviar.</p>
    <h4>🔊 Respuestas habladas</h4>${ttsSection()}`);
  ttsBind();
  const box=$('#voiceOpts'); if(!box)return;
  opts.forEach(([k,l,d])=>{const r=document.createElement('button');r.className='mode-opt'+(prefs.voice===k?' on':'');
    r.dataset.voice=k; r.innerHTML=`${l}<small>${d}${k==='browser'&&!SR?' · no disponible en este navegador':''}</small>`;
    r.disabled=k==='browser'&&!SR;
    r.onclick=()=>{prefs.voice=k;if(k==='whisper')prefs.voiceBrowserOk=false;savePrefs();paintMic();voiceDialog()};
    box.appendChild(r)});
}
$('#stopBtn').onclick=()=>{api('/api/cmd',{cmd:'stop'});toast('Deteniendo…')};
// Esc detiene, como en Claude Code (si el cuadro de texto está vacío y no hay nada abierto encima)
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'||!status.busy||e.defaultPrevented)return;
  if(document.querySelector('dialog[open]')||!$('#cmdList').hidden||(typeof findOpen==='function'&&findOpen()))return;
  if(document.activeElement===input&&input.value.trim())return;
  e.preventDefault(); $('#stopBtn').click();
});
function setMenu(open){$('#menu').classList.toggle('open',open);$('#menuBtn').setAttribute('aria-expanded',String(open))}
$('#menuBtn').onclick=e=>{e.stopPropagation();setMenu(!$('#menu').classList.contains('open'))};
// se cierra al tocar fuera o con Esc
document.addEventListener('click',e=>{if($('#menu').classList.contains('open')&&!e.target.closest('#menu'))setMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#menu').classList.contains('open')){e.preventDefault();setMenu(false);$('#menuBtn').focus()}},true);

document.querySelectorAll('#menu [data-cmd]').forEach(b=>b.onclick=async()=>{
  setMenu(false);
  const cmd=b.dataset.cmd;
  if(cmd==='new'){if(confirm('¿Empezar una sesión nueva?'))api('/api/cmd',{cmd})}
  else if(cmd==='status'){const j=await api('/api/cmd',{cmd});if(j.status){const s=j.status;
    showDialog(`<h3>ℹ️ Estado</h3><p>📁 <code>${esc(s.cwd)}</code></p><p>🧵 ${esc(s.session||'sesión nueva')}</p>
      <p>${s.busy?'⏳ Trabajando':'💤 Libre'} · decisiones pendientes: ${s.pending}</p><p>Gateway: <code>${esc(s.gateway)}</code></p>
      <p>Aprobadas siempre: ${esc(s.always.join(', ')||'—')}</p><p class="note">Mando ${esc(s.version||'')}</p>`)}}
  else if(cmd==='sessions'&&!caps().resume)toast(`Retomar conversaciones está disponible con Claude Code, no con ${agentName()}`);
  else if(cmd==='sessions'){const j=await api('/api/cmd',{cmd});const list=j.sessions||[];
    showDialog('<h3>🧵 Sesiones recientes</h3>'+(list.length?'':'<p>No hay sesiones guardadas para esta carpeta.</p>'));
    list.forEach(s=>{const r=document.createElement('button');r.className='row';
      r.innerHTML=`${esc(s.title)}<small>${esc(s.id.slice(0,8))} · ${new Date(s.mtime*1000).toLocaleString()}</small>`;
      r.onclick=()=>{dlg.close();api('/api/cmd',{cmd:'resume',arg:s.id})};$('#dlgBody').appendChild(r)})}
  else if(cmd==='cd'){const j=await api('/api/cmd',{cmd});
    const p=prompt('Carpeta de trabajo (dentro de: '+(j.roots||[]).join(', ')+')',j.cwd||'');
    if(p&&p!==j.cwd)api('/api/cmd',{cmd:'cd',arg:p})}
  else if(cmd==='alerts')alertsDialog();
  else if(cmd==='usage')usageDialog();
  else if(cmd==='voice')voiceDialog();
  else if(cmd==='templates')templatesDialog();
  else if(cmd==='schedules')schedulesDialog();
  else if(cmd==='jira')jiraDialog();
  else if(cmd==='backup')backupDialog();
  else if(cmd==='daily')dailyDialog();
  else if(cmd==='export')exportDialog();
  else if(cmd==='rules')rulesDialog();
  else if(cmd==='security')securityDialog();
  else if(cmd==='logout'){await fetch('/logout',{method:'POST'});location.reload()}
});
function showDialog(html){$('#dlgBody').innerHTML=html;dlg.showModal();dlg.scrollTop=0}
$('#dlgX').onclick=$('#dlgClose').onclick=()=>dlg.close();
// Tocar fuera del diálogo (en el fondo oscuro) también lo cierra
dlg.addEventListener('click',e=>{if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dlg.close()});
</script>
